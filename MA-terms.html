<div class="scr hidden" id="s-MA-terms" data-roles="MN MS"><div class="mb-6"><div class="text-[12px] text-outline mb-1">마스터관리자 › 계약서 약관 관리</div><div class="flex items-end gap-3 flex-wrap"><h1 class="text-[28px] leading-tight font-bold text-primary">계약서 약관 관리</h1><span class="font-label-md text-[11px] text-outline border border-outline-variant px-2 py-0.5 rounded-[2px] mb-1">MA-terms</span><span class="text-[11px] font-bold text-primary bg-primary/5 border border-primary/20 px-2 py-0.5 rounded-full mb-1">시스템 입력형</span></div><p class="text-body-sm text-on-surface-variant mt-1">FN-MA-001 · 인증심사 계약서(P90401)의 약관 조항을 편집합니다 · 저장 시 신규 계약서부터 반영</p></div><section class="qsec bg-white border border-outline-variant p-6 mb-6"><h3 class="flex items-center gap-2 text-body-lg font-bold text-primary mb-4"><span class="w-1 h-4 bg-secondary inline-block"></span>버전 정보</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5"><div class=""><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">약관 버전<span class="text-error font-bold ml-0.5">*</span></label><input value="P90401 Rev.2026.07.01" class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" placeholder="약관 버전 입력" data-req="1"></div></div><div class=""><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">적용 시작일<span class="text-error font-bold ml-0.5">*</span></label><input type="date" value="2026-07-01" class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 max-w-[180px]" data-req="1"></div></div><div class=""><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">최종 수정자</label><input value="마스터관리자" readonly class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 bg-surface-container-low text-on-surface-variant"></div></div><div class=""><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">최종 수정일</label><input value="2026-08-29" readonly class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 bg-surface-container-low text-on-surface-variant"></div></div><div class="md:col-span-2"><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">변경 사유</label><textarea rows="3" class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 h-auto py-2 leading-relaxed"></textarea></div></div></div></section><section class="qsec bg-white border border-outline-variant p-6 mb-6"><h3 class="flex items-center gap-2 text-body-lg font-bold text-primary mb-4"><span class="w-1 h-4 bg-secondary inline-block"></span>제1조 계약범위</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5"><div class="md:col-span-2"><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">조항 본문<span class="text-error font-bold ml-0.5">*</span></label><textarea rows="3" class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 h-auto py-2 leading-relaxed" data-req="1">1.1 신청조직은 상기 인증 표준에 대하여 신청한다.
1.2 인증 범위는 신청조직이 신청한 조직의 제품 및 활동 범위 내에서 협의하여 결정한다.
1.3 최초 인증심사 비용은 심사 7일 전까지 해당 비용을 납부한다. 단, 별도의 협의를 통해 신청조직의 비용 집행 규정(납부기한)에 따라 해당 비용을 납부할 수 있다.
1.4 최초 인증심사 비용은 비용 산정에 영향을 미치는 정보(사업장, 심사일수)의 변경에 따라 신청조직과 SSR의 협의에 의해 변경될 수 있다.</textarea></div></div></div></section><section class="qsec bg-white border border-outline-variant p-6 mb-6"><h3 class="flex items-center gap-2 text-body-lg font-bold text-primary mb-4"><span class="w-1 h-4 bg-secondary inline-block"></span>제2조 계약기간 및 계약종료</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5"><div class="md:col-span-2"><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">조항 본문<span class="text-error font-bold ml-0.5">*</span></label><textarea rows="3" class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 h-auto py-2 leading-relaxed" data-req="1">2.1 본 계약에 의한 동의 사항은 두 기관이 서명을 함으로써 그 효력이 발생하며 인증이 유지되는 기간 동안 그 효력이 지속된다.
2.2 계약기간은 최초 계약일로부터 인증서 발행 후 3년으로 한다. 단, 계약종료 1개월 전까지 본 계약의 변경이나 종료 의사 표명이 없는 경우 3년의 계약기간이 연장된 것으로 간주하며, 이후에도 같은 방법으로 갱신된다.</textarea></div></div></div></section><section class="qsec bg-white border border-outline-variant p-6 mb-6"><h3 class="flex items-center gap-2 text-body-lg font-bold text-primary mb-4"><span class="w-1 h-4 bg-secondary inline-block"></span>제3조 기밀유지</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5"><div class="md:col-span-2"><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">조항 본문<span class="text-error font-bold ml-0.5">*</span></label><textarea rows="3" class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 h-auto py-2 leading-relaxed" data-req="1">3.1 SSR은 인정기관의 요청 또는 다음의 경우를 제외하고, 신청조직의 사전 동의 없이 인증 활동의 수행 과정에서 입수했거나 생성된 조직의 정보에 대해 기밀을 유지해야 하며, 기밀유지 의무는 인증 유지 기간 및 본 계약 종료 후에도 지켜져야 한다.
3.1.1 일반 대중에게 공개되는 인증 정보 : 인증 조직명, 주소, 표준, 범위, 상태(유지/정지/취소), 일자
3.1.2 인정 등록을 위하여 요구되는 정보 : 인증 조직명, 주소, 표준, 범위, 상태(유지/정지/취소), 일자
3.1.3 법정에서 소환장에 의거하여 공개가 요구되는 정보</textarea></div></div></div></section><section class="qsec bg-white border border-outline-variant p-6 mb-6"><h3 class="flex items-center gap-2 text-body-lg font-bold text-primary mb-4"><span class="w-1 h-4 bg-secondary inline-block"></span>제4조 이의제기 및 불만</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5"><div class="md:col-span-2"><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">조항 본문<span class="text-error font-bold ml-0.5">*</span></label><textarea rows="3" class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 h-auto py-2 leading-relaxed" data-req="1">4.1 신청조직은 SSR의 인증 절차에 대해 이의 제기 및 불만을 신청할 수 있으며, SSR은 이의제기 및 불만처리 절차에 따라 해결한다.
4.2 SSR은 해당 이의제기자 및 불만제기자에 대해 어떠한 차별적 조치를 취하지 않으며, 접수사실·경과보고 및 결과를 해당 제기자에게 제공해야 한다.
4.3 이의제기 프로세스는 부적합 처리 또는 인증 취소 프로세스 진행 시점에 영향을 미치지 않는다.</textarea></div></div></div></section><section class="qsec bg-white border border-outline-variant p-6 mb-6"><h3 class="flex items-center gap-2 text-body-lg font-bold text-primary mb-4"><span class="w-1 h-4 bg-secondary inline-block"></span>제5조 법률선택</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5"><div class="md:col-span-2"><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">조항 본문<span class="text-error font-bold ml-0.5">*</span></label><textarea rows="3" class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 h-auto py-2 leading-relaxed" data-req="1">5.1 본 계약에 관련된 모든 분쟁의 사법권역은 SSR 소재지의 관할 법원이다. 본 계약은 대한민국 법에 의한다.</textarea></div></div></div></section><section class="qsec bg-white border border-outline-variant p-6 mb-6"><h3 class="flex items-center gap-2 text-body-lg font-bold text-primary mb-4"><span class="w-1 h-4 bg-secondary inline-block"></span>제6조 신청조직의 일반 권리와 의무</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5"><div class="md:col-span-2"><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">조항 본문<span class="text-error font-bold ml-0.5">*</span></label><textarea rows="3" class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 h-auto py-2 leading-relaxed" data-req="1">6.1 신청조직은 이 계약서에 근거하여 신청조직의 경영시스템을 해당 인증 요구사항에 따라 적합하게 운영할 것을 합의한다.
6.2 신청조직은 심사 시 심사원이 인증범위에 관련된 기록을 심사할 수 있도록 해야 하며, 심사 대상이 되는 조직 내 부서 및 단위조직에 접근할 수 있도록 편의를 제공하여야 한다.
6.3 인증 승인 이후, 신청조직은 인증 유지에 영향을 줄 수 있는 다음 사안을 지체 없이(15일 이내) SSR에 통보해야 한다.
   6.3.1 법적·상업적·조직적 지위 또는 소유권 상황
   6.3.2 조직 및 경영진 (예: 핵심경영진, 의사결정자 또는 기술직 직원)
   6.3.3 연락주소 및 사업장
   6.3.4 인증받은 표준 운영의 적용범위
   6.3.5 인증받은 표준 운영의 프로세스에 대한 변경
   6.3.6 인증받은 표준과 관련된 이해관계자의 이의제기 발생 시
   6.3.7 (ISO 45001 신청조직) 안전보건 관련 중대한 사건(예: 중대재해)이나 규제당국의 관여가 필요한 법규 위반사항이 발생한 경우
6.4 신청조직은 8항에 따라 인증마크 및 인증사실에 대해 홍보할 수 있다.
6.5 신청조직은 인정기관(KAB)의 인정업무 수행(심사원 입회평가, 이해관계자 조사 요구)을 위한 조사에 협조하여야 한다. 단, SSR은 인정 업무 활동의 범위를 사전에 안내하고 일정을 협의하여야 하며, 관련 비용은 SSR 또는 KAB이 부담한다.</textarea></div></div></div></section><section class="qsec bg-white border border-outline-variant p-6 mb-6"><h3 class="flex items-center gap-2 text-body-lg font-bold text-primary mb-4"><span class="w-1 h-4 bg-secondary inline-block"></span>제7조 SSR의 일반 권리와 의무</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5"><div class="md:col-span-2"><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">조항 본문<span class="text-error font-bold ml-0.5">*</span></label><textarea rows="3" class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 h-auto py-2 leading-relaxed" data-req="1">7.1 SSR은 신청조직의 최초인증·사후인증·갱신인증을 위한 의무를 사전에 안내하여야 한다.
7.2 SSR은 인증 승인·유지·갱신·확대·축소·정지·취소 및 복원을 포함하여 인증에 관련된 결정에 대한 책임과 권한을 갖는다.
7.3 SSR은 인증 요구사항의 변경에 대해 신청조직에게 적절한 기간을 두고 통지해야 하며, 새로운 요구사항 준수 여부를 검증해야 한다.
7.4 SSR은 신청조직의 기밀사항을 포함한 모든 정보를 접할 수 있으며, 이러한 정보는 시스템 평가 목적으로만 다루어야 한다.
7.5 SSR은 인증 절차 안내 후 인증심사를 수행하고, 심사 결과가 긍정적일 경우 인증서를 발행하거나 유지시킨다.
7.6 SSR은 인증된 조직의 명부를 상세한 인증 코드 범위와 함께 유지해야 한다.
7.7 (ISO 45001 신청조직) 6.3.7항의 중대한 사건에 대해 수집된 정보에 의해 안전보건경영시스템이 인증 요구사항 충족에 심각하게 실패한 것이 실증된 경우, 신청조직의 인증을 정지·취소할 수 있다.
7.8 SSR은 7.7항에 따른 정지·취소를 포함하여 취할 조치를 결정하는 근거를 신청조직에게 제공한다.</textarea></div></div></div></section><section class="qsec bg-white border border-outline-variant p-6 mb-6"><h3 class="flex items-center gap-2 text-body-lg font-bold text-primary mb-4"><span class="w-1 h-4 bg-secondary inline-block"></span>제8조 SSR 인증마크 사용 권리 및 범위</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5"><div class="md:col-span-2"><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">조항 본문<span class="text-error font-bold ml-0.5">*</span></label><textarea rows="3" class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 h-auto py-2 leading-relaxed" data-req="1">8.1 인증마크에 대한 소유권은 SSR에 있다.
8.2 신청조직은 인증서가 발급된 날로부터 SSR의 「인증표시 사용절차」에 따라 인증마크 및 인증 사실을 홍보할 수 있다.
8.3 SSR은 신청조직이 「인증표시 사용절차」와 부합되지 않는 방식으로 오용하는 경우 시정 및 시정조치 요구, 인증 정지·취소, 위반사실 공표, 필요한 경우 법적 조치를 취할 수 있다.
8.4 신청조직의 인증이 취소된 경우 인증마크 사용 및 인증서 유지에 관한 효력이 종료되며, SSR은 인증서를 회수하거나 취소할 권한을 갖는다.
8.5 인증마크 사용에 관한 권리의 종료 시에 신청조직은 인증서를 SSR에 반납해야 한다.</textarea></div></div></div></section><section class="qsec bg-white border border-outline-variant p-6 mb-6"><h3 class="flex items-center gap-2 text-body-lg font-bold text-primary mb-4"><span class="w-1 h-4 bg-secondary inline-block"></span>제9조 계약 동의</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5"><div class="md:col-span-2"><div class="flex flex-col gap-1.5"><label class="text-[12px] font-bold text-on-surface-variant">조항 본문<span class="text-error font-bold ml-0.5">*</span></label><textarea rows="3" class="fld w-full h-10 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 h-auto py-2 leading-relaxed" data-req="1">9.1 본 계약서는 2부로 발행하며 SSR 및 신청조직의 대표자에 의해 서명된다.</textarea></div></div></div></section><div class="flex justify-end gap-2"><button class="px-6 h-11 text-body-md font-bold rounded-[2px] transition-all bg-white border border-outline-variant text-on-surface hover:bg-surface-container-low" data-act="취소" data-go="MA-docList">취소</button><button class="px-6 h-11 text-body-md font-bold rounded-[2px] transition-all bg-white border border-outline-variant text-on-surface hover:bg-surface-container-low" data-act="미리보기">미리보기</button><button class="px-6 h-11 text-body-md font-bold rounded-[2px] transition-all bg-primary text-white hover:brightness-110" data-act="저장 후 적용" data-go="MA-docList">저장 후 적용</button></div></div>
