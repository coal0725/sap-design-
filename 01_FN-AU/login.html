          <div>
            <label class="block text-[12px] font-bold text-on-surface-variant mb-1.5">비밀번호</label>
            <input id="loginPw" type="password" class="w-full h-11 px-3 border border-outline-variant rounded-[2px] text-body-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" placeholder="비밀번호를 입력하세요">
          </div>
          <div>
            <label class="block text-[12px] font-bold text-on-surface-variant mb-1.5">권한 (시연용)</label>
            <select id="loginRole" class="w-full h-11 px-3 border border-outline-variant rounded-[2px] text-body-sm bg-white"><option value="PA">심사원보</option><option value="A">심사원</option><option value="LA">선임심사원</option><option value="VA">검증심사원</option><option value="MN">일반관리자</option><option value="MS">마스터관리자</option></select>
          </div>
          <button id="loginBtn" class="w-full h-12 bg-primary text-white font-bold rounded-[2px] hover:brightness-110 transition-all">로그인</button>
          <div id="loginErr" class="hidden text-[12.5px] text-error font-medium">아이디와 비밀번호를 입력해주세요.</div>
        </div>

          <button class="text-primary font-bold hover:underline" id="toGuest">기업 인증심사 신청 (로그인 없이 진행) →</button>

<script src="../_common/routes.js"></script>
<script>
var LANDING = {PA:'MY-mp', A:'MY-mp', LA:'MY-mp', VA:'MY-mp', MN:'CM-dash', MS:'CM-dash'};
function go(){
  var id=document.getElementById('loginId').value.trim();
  var pw=document.getElementById('loginPw').value.trim();
  var err=document.getElementById('loginErr');
  if(!id||!pw){ err.classList.remove('hidden'); return; }
  err.classList.add('hidden');
  var role=document.getElementById('loginRole').value;
  try{ sessionStorage.setItem('ssr.role',role); sessionStorage.setItem('ssr.authed','1'); }catch(e){}
  var b=document.getElementById('loginBtn'); b.textContent='로그인 중입니다…'; b.disabled=true;
  setTimeout(function(){ location.href = ROUTES[LANDING[role]||'MY-mp']; }, 700);
}
document.getElementById('loginBtn').addEventListener('click', go);
document.getElementById('loginPw').addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });
var tg=document.getElementById('toGuest');
if(tg) tg.addEventListener('click', function(){
  try{ sessionStorage.setItem('ssr.role','G'); sessionStorage.setItem('ssr.authed','0'); }catch(e){}
  location.href = ROUTES['AP-welcome'];
});
</script>
